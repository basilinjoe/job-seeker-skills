[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jsk-resume"
dynamic = ["version"]
description = "Render verified, ATS-safe resumes from a career kept in one Markdown file"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [{ name = "Basilin Joe" }]
keywords = [
    "resume", "cv", "ats", "career", "job-search",
    "knowledge-base", "tailoring", "urs", "latex", "pdf",
]

# Deliberately empty. Every dependency this toolchain has is optional and imported at
# the point of use, so a bare `pip install jsk-resume` gives a working record gate,
# prose gate and .txt parse gate. That is what lets `jsk doctor` report on a machine
# before anything has been installed on it - and preflight.py's founding rule is that
# a preflight needing an install first is not a preflight.
dependencies = []

[project.optional-dependencies]
# What it buys is spelt out in `jsk doctor`, which reports a missing package as the
# capability it costs you rather than as a package name.
#
# `pyyaml` went with the bundle format and `jsonschema` went with a URS schema that
# never existed - nothing imported it, so it was a dependency that bought a line in
# the doctor's report and nothing else.
#
# `pyyaml` came back with `jsk index`, beside markdown-it-py: the two replaced about
# a hundred lines of hand-written Markdown and YAML parsing, and they are optional -
# `jsk index` says what to install rather than failing on import.
pdf = ["pymupdf"]                # the PDF parse gate, and the page budget
index = ["markdown-it-py", "pyyaml"]   # jsk index: the knowledge base's overview and ranking
all = ["pymupdf", "markdown-it-py", "pyyaml"]
dev = ["pymupdf", "markdown-it-py", "pyyaml", "pytest", "pytest-xdist", "ruff"]

[project.scripts]
jsk = "jsk.cli:main_console"

[project.urls]
Homepage = "https://github.com/basilinjoe/job-seeker-skills"
Repository = "https://github.com/basilinjoe/job-seeker-skills"

[tool.hatch.version]
path = "src/jsk/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/jsk"]

[tool.hatch.build.targets.sdist]
include = ["src/jsk", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Deliberately not `-n auto`. The suite is dominated by TeX - the render tests compile
# real PDFs and read their text layers back - and the tests share nothing but temp
# directories they create themselves, so `python -m pytest tests -n auto` is the way to
# run it while working. It is not in addopts because pytest-xdist is a dev extra:
# putting it here makes every bare checkout fail on an unrecognised flag, and the
# suite has to keep running on a plain interpreter.
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# Scoped so that `ruff check src tests` is CLEAN today, which is the only thing that
# makes it a gate rather than a wall of pre-existing noise nobody runs. This codebase
# predates any linter; a config that reported 257 findings on arrival would have been
# switched off within a week.
#
# `E,F,W` catch the things that are actually wrong - an undefined name, an unused
# import, a redefinition. Those are worth failing a build over from now on.
select = ["E", "F", "W"]
ignore = [
    "E501",     # line-length is set above; what is left over is prose inside strings
    "E741",
    # 16 f-strings with no placeholder, all of them refusal messages sitting in a block
    # of siblings that do interpolate. Removing the `f` one line at a time makes the
    # block harder to read than leaving it.
    "F541",
    "E702", "E701", "E401",   # `if x: continue` and paired imports, used deliberately
]

# Deferred, each its own commit, none of them a correctness problem:
#
#   UP031    96x  %-formatting. Mechanical, and a big diff across every module.
#   I001     40x  import order. Same.
#   PLC0415  38x  lazy imports - DELIBERATE and documented at every site: a command
#                 must not pay for a module it never reaches, which is what keeps a
#                 write at about the interpreter floor. If PL is ever selected, this
#                 one stays ignored permanently.
#   BLE001         blind excepts - also deliberate, and also documented: they are what
#                 turn a would-be traceback into a verdict a person can act on.
#   PLW1510   9x  subprocess.run without check= - every call site reads returncode.
#   PLR09xx        argument and branch counts. These are CLIs; that is the job.

[tool.ruff.lint.per-file-ignores]
# The tests assert on exact output text, so their long string literals are the point.
"tests/*" = ["E501", "PLR2004"]
